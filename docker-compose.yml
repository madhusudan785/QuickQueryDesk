# QuickQueryDesk — Docker Compose
# Start the entire stack: docker compose up --build

services:
  # --- PostgreSQL Database ---
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quickquery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quickquery_pass}
      POSTGRES_DB: ${POSTGRES_DB:-quickquerydesk}
    ports:
      - "5433:5432"    # Expose on 5433 to avoid conflict with host PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quickquery} -d ${POSTGRES_DB:-quickquerydesk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- FastAPI Backend ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-quickquery}:${POSTGRES_PASSWORD:-quickquery_pass}@db:5432/${POSTGRES_DB:-quickquerydesk}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-groq/compound-mini}
    depends_on:
      db:
        condition: service_healthy

  # --- React/Vite Frontend (served via nginx) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
